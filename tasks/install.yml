---

- name: Ensure Caddy paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: "{{ caddy_uid }}"
    group: "{{ caddy_gid }}"
  loop:
    - "{{ caddy_base_path }}"
    - "{{ caddy_config_path }}"
    - "{{ caddy_data_path }}"
    - "{{ caddy_log_path }}"
    - "{{ caddy_www_path }}"

- name: Ensure Caddy GeoIP archives are downloaded
  ansible.builtin.shell:
    cmd: curl -fsSL -u "$MM_AUTH" -o "/tmp/{{ item }}.tar.gz" "{{ caddy_geoip_url }}"
  environment:
    MM_AUTH: "{{ caddy_geoip_account_id }}:{{ caddy_geoip_license_key }}"
  loop: "{{ caddy_geoip_editions }}"
  when: caddy_geoip_account_id != "" and caddy_geoip_license_key != ""
  register: caddy_geoip_download
  failed_when: false
  changed_when: caddy_geoip_download.rc == 0

- name: Ensure Caddy GeoIP databases are extracted
  ansible.builtin.unarchive:
    remote_src: true
    src: "/tmp/{{ item }}.tar.gz"
    dest: "{{ caddy_data_path }}"
    owner: "{{ caddy_uid }}"
    group: "{{ caddy_gid }}"
    extra_opts:
      - --strip-components=1
  loop: "{{ caddy_geoip_download.results | selectattr('rc', 'defined') | selectattr('rc', 'eq', 0) | map(attribute='item') | list }}"

- name: Check that Caddy GeoIP databases are present
  ansible.builtin.stat:
    path: "{{ caddy_data_path }}/{{ item }}.mmdb"
  loop: "{{ caddy_geoip_editions }}"
  register: caddy_geoip_stat

- name: Fail if Caddy GeoIP databases are missing
  ansible.builtin.fail:
    msg: "Missing GeoIP database(s): {{ caddy_geoip_stat.results | rejectattr('stat.exists') | map(attribute='item') | join(', ') }}. Check caddy_geoip_account_id/caddy_geoip_license_key; Caddy will refuse to start if a site references them."
  when: caddy_geoip_stat.results | rejectattr('stat.exists') | list | length > 0

- name: Ensure Caddy configuration files are created
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ caddy_base_path }}/{{ item }}"
    mode: "0644"
    owner: "{{ caddy_uid }}"
    group: "{{ caddy_gid }}"
    backup: true
  loop:
    - Caddyfile
    - Dockerfile

- name: Ensure Caddy image is pulled
  community.docker.docker_image:
    name: "{{ caddy_container_image }}"
    source: "{{ 'pull' if ansible_version.major > 2 or ansible_version.minor >= 8 else omit }}"
    force_source: "{{ caddy_container_image_force_pull if ansible_version.major > 2 or ansible_version.minor >= 8 else omit }}"
    force: "{{ caddy_container_image_force_pull if ansible_version.major == 2 and ansible_version.minor < 8 else omit }}"
  register: result
  retries: "{{ devture_playbook_help_container_retries_count | default(2) }}"
  delay: "{{ devture_playbook_help_container_retries_delay | default(5) }}"
  until: result is not failed
  when: caddy_additional_modules | length == 0

- name: Remove existing Caddy image (for custom build)
  community.docker.docker_image:
    name: "{{ caddy_container_image }}"
    state: absent
  when: caddy_additional_modules | length > 0

- name: Ensure custom Caddy image is built
  community.docker.docker_image_build:
    name: "{{ caddy_container_image }}"
    path: "{{ caddy_base_path }}"
    pull: true
    nocache: "{{ caddy_container_image_force_pull }}"
  register: result
  retries: "{{ devture_playbook_help_container_retries_count | default(2) }}"
  delay: "{{ devture_playbook_help_container_retries_delay | default(5) }}"
  until: result is not failed
  when: caddy_additional_modules | length > 0

- name: Ensure Caddy container network is created
  community.docker.docker_network:
    name: "{{ caddy_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options | default({}) }}"
    enable_ipv6: "{{ caddy_enable_ipv6 }}"

- name: Ensure Caddy systemd service is installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/caddy.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ caddy_identifier }}.service"
    mode: "0644"
    backup: true

- name: Ensure systemd daemon is reloaded
  ansible.builtin.systemd:
    daemon_reload: true
  when: ansible_facts["service_mgr"] == 'systemd'
